<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="جست‌وجوی حرفه‌ای در مکان‌ها، شهدا، رویدادها و مسیرهای اطلس شهدا.">
<title>جست‌وجوی اطلس | اطلس شهدا</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/pages.css">
<style>
.search-page{padding:28px 0 70px}
.search-hero{padding:34px 0 24px}
.search-hero h1{font-size:clamp(28px,4vw,44px);margin:12px 0 8px}
.search-hero p{max-width:700px;color:var(--muted);font-size:14px;line-height:1.9}
.search-box{margin-top:24px;display:flex;gap:10px;padding:9px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md)}
.search-box input{min-height:52px;border:0!important;box-shadow:none!important;background:transparent}
.search-submit{min-width:118px;padding:0 20px;border-radius:11px;background:var(--brand);color:#fff;font-weight:800}
.search-layout{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start;margin-top:22px}
.search-filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:100px}
.search-filters h3{font-size:14px;margin-bottom:12px}
.search-filter{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:9px;color:var(--muted);font-size:12px;font-weight:700}
.search-filter:hover,.search-filter.on{background:var(--brand-soft);color:var(--brand-d)}
.search-filter span:last-child{font-size:10px;color:var(--muted-2)}
.search-results{min-width:0}
.search-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:12px}
.search-sort{width:auto;min-height:36px;padding:6px 10px;font-size:11px}
.result-list{display:grid;gap:10px}
.result-card{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:.2s}
.result-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.result-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--paper-2);color:var(--brand);font-size:17px;font-weight:900}
.result-card h3{font-size:14px;margin-bottom:4px}
.result-card p{font-size:11.5px;color:var(--muted);line-height:1.7;margin:0}
.result-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.result-meta span{font-size:9.5px;color:var(--muted-2);padding:3px 7px;background:var(--paper-2);border-radius:6px}
.result-arrow{color:var(--muted-2)}
.search-empty{padding:50px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px}
.search-empty h3{font-size:18px;margin-bottom:6px}
.search-empty p{font-size:12px;color:var(--muted)}
.pagination{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:18px;flex-wrap:wrap}
.page-btn{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font:inherit;font-size:11px;font-weight:800}
.page-btn:hover,.page-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.page-btn:disabled{opacity:.35}
@media(max-width:760px){
 .search-layout{grid-template-columns:1fr}
 .search-filters{position:static;display:flex;gap:6px;overflow:auto;padding:8px}
 .search-filters h3{display:none}
 .search-filter{min-width:105px;justify-content:center}
 .search-filter span:last-child{display:none}
 .result-card{grid-template-columns:auto 1fr}
 .result-arrow{display:none}
 .search-box{border-radius:13px}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">پرش به محتوا</a>
<div id="site-header"></div>
<main id="main"><div class="container search-page">
<section class="search-hero">
<nav class="place-breadcrumb" aria-label="مسیر"><a href="../index.html">خانه</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span class="current">جست‌وجوی اطلس</span></nav>
<h1>جست‌وجوی اطلس</h1>
<p>در مکان‌ها، اطلاعات هویتی، رویدادهای مرتبط و مسیرهای ثبت‌شده جست‌وجو کنید. نتایج بر اساس میزان ارتباط مرتب می‌شوند و در صفحات جداگانه نمایش داده می‌شوند.</p>
<div class="search-box"><input id="searchInput" type="search" placeholder="نام مکان، شهید، رویداد، استان یا مسیر…" autocomplete="off"><button id="searchSubmit" class="search-submit" type="button">جست‌وجو</button></div>
</section>
<div class="search-layout">
<aside class="search-filters"><h3>نوع نتیجه</h3><button class="search-filter on" data-type="all" type="button"><span>همه</span><span id="count-all">۰</span></button><button class="search-filter" data-type="location" type="button"><span>مکان‌ها</span><span id="count-location">۰</span></button><button class="search-filter" data-type="person" type="button"><span>شهدا</span><span id="count-person">۰</span></button><button class="search-filter" data-type="event" type="button"><span>رویدادها</span><span id="count-event">۰</span></button><button class="search-filter" data-type="route" type="button"><span>مسیرها</span><span id="count-route">۰</span></button></aside>
<section class="search-results" aria-live="polite"><div class="search-summary"><span id="summary"></span><select id="sort" class="search-sort" aria-label="مرتب‌سازی"><option value="relevance">ارتباط بیشتر</option><option value="name">نام</option></select></div><div id="resultList" class="result-list"></div><div id="pagination" class="pagination"></div></section>
</div>
</div></main>
<div id="site-footer"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/data-generator.js"></script>
<script src="../assets/js/components.js"></script>
<script>
(function(){
'use strict';
var D=window.ATLAS||{}, state={q:'',type:'all',page:1,sort:'relevance'}, perPage=10;
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[+d]})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function normalize(s){return String(s||'').toLowerCase().replace(/[يى]/g,'ی').replace(/[ك]/g,'ک')}
function build(){
 var a=[];
 (D.locations||[]).forEach(function(x){a.push({type:'location',name:x.name,desc:x.desc,meta:[x.province,x.city,(D.layers||[]).find(function(l){return l.slug===x.layer;})?.name||'مکان'],icon:'⌖',score:0})});
 (D.persons||[]).forEach(function(x){a.push({type:'person',name:x.name,desc:x.desc,meta:['شهید'],icon:x.initial||'ش',score:0})});
 (D.events||[]).forEach(function(x){a.push({type:'event',name:x.title,desc:x.desc,meta:[x.province,x.type],icon:'◷',score:0})});
 (D.routes||[]).forEach(function(x){a.push({type:'route',name:x.title,desc:x.desc,meta:[x.type,fa(x.points)+' نقطه'],icon:'↝',score:0})});
 return a;
}
var all=build();
function score(x,q){if(!q)return 1;var n=normalize(x.name+' '+x.desc+' '+x.meta.join(' ')),qq=normalize(q);if(!n.includes(qq))return 0;var s=n.indexOf(qq)===0?100:50;if(normalize(x.name).includes(qq))s+=30;return s}
function filtered(){
 var q=state.q.trim(), arr=all.filter(function(x){return state.type==='all'||x.type===state.type}).map(function(x){x.score=score(x,q);return x}).filter(function(x){return !q||x.score>0});
 arr.sort(function(a,b){return state.sort==='name'?a.name.localeCompare(b.name,'fa'):b.score-a.score});
 return arr;
}
function renderCounts(){
 var types=['all','location','person','event','route'];types.forEach(function(t){var n=t==='all'?all.length:all.filter(function(x){return x.type===t}).length;document.getElementById('count-'+t).textContent=fa(n)});
}
function render(){
 var arr=filtered(), pages=Math.max(1,Math.ceil(arr.length/perPage));if(state.page>pages)state.page=pages;
 var start=(state.page-1)*perPage, items=arr.slice(start,start+perPage);
 document.getElementById('summary').textContent=arr.length?fa(arr.length)+' نتیجه · صفحه '+fa(state.page)+' از '+fa(pages):'نتیجه‌ای پیدا نشد';
 document.getElementById('resultList').innerHTML=items.length?items.map(function(x){return '<article class="result-card"><div class="result-icon">'+esc(x.icon)+'</div><div><h3>'+esc(x.name)+'</h3><p>'+esc(x.desc)+'</p><div class="result-meta">'+x.meta.map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div></div><span class="result-arrow">←</span></article>'}).join(''):'<div class="search-empty"><h3>نتیجه‌ای پیدا نشد</h3><p>عبارت دیگری را امتحان کنید یا فیلتر را روی «همه» بگذارید.</p></div>';
 var pg=document.getElementById('pagination');if(pages<=1){pg.innerHTML='';return}
 var h='<button class="page-btn" type="button" '+(state.page===1?'disabled':'')+' data-page="'+(state.page-1)+'">قبلی</button>';
 var from=Math.max(1,state.page-2),to=Math.min(pages,from+4);if(to-from<4)from=Math.max(1,to-4);
 for(var i=from;i<=to;i++)h+='<button class="page-btn '+(i===state.page?'on':'')+'" type="button" data-page="'+i+'">'+fa(i)+'</button>';
 h+='<button class="page-btn" type="button" '+(state.page===pages?'disabled':'')+' data-page="'+(state.page+1)+'">بعدی</button>';pg.innerHTML=h;
 pg.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){if(!b.disabled){state.page=+b.dataset.page;render();window.scrollTo({top:300,behavior:'smooth'})}})});
}
function syncUrl(){var u=new URL(window.location.href);u.searchParams.set('q',state.q);history.replaceState(null,'',u)}
function run(){
 var p=new URLSearchParams(location.search);state.q=p.get('q')||'';document.getElementById('searchInput').value=state.q;renderCounts();render();
 document.querySelectorAll('.search-filter').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.search-filter').forEach(function(x){x.classList.remove('on')});b.classList.add('on');state.type=b.dataset.type;state.page=1;render()})});
 document.getElementById('sort').addEventListener('change',function(e){state.sort=e.target.value;state.page=1;render()});
 function submit(){state.q=document.getElementById('searchInput').value.trim();state.page=1;syncUrl();render()}
 document.getElementById('searchSubmit').addEventListener('click',submit);document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
</body>
</html>
