<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ed">
<meta name="description" content="صفحه موردنظر در اطلس شهدا پیدا نشد.">
<title>صفحه پیدا نشد | اطلس شهدا</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<style>
:root{--atlas-green:#2f6b4a;--atlas-ink:#26352e;--atlas-muted:#6d776f;--atlas-paper:#f7f4ed;--atlas-line:#ddd8cc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Vazirmatn,IRANSans,Arial,sans-serif}
body{background:var(--atlas-paper);color:var(--atlas-ink)}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;position:relative;overflow:hidden}
.page:before,.page:after{content:"";position:absolute;border:1px solid rgba(47,107,74,.12);border-radius:50%;pointer-events:none}
.page:before{width:520px;height:520px;top:-280px;left:-180px}
.page:after{width:430px;height:430px;bottom:-260px;right:-170px}
.card{width:min(620px,100%);text-align:center;position:relative;z-index:1}
.logo{width:104px;height:104px;object-fit:contain;display:block;margin:0 auto 24px;filter:drop-shadow(0 10px 22px rgba(31,48,39,.09))}
.code{font-size:clamp(58px,12vw,92px);line-height:1;font-weight:800;letter-spacing:-4px;color:var(--atlas-green);margin:0 0 12px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.6;margin:0 0 12px;font-weight:800}
p{max-width:500px;margin:0 auto;color:var(--atlas-muted);font-size:16px;line-height:2}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:700;transition:.2s ease}
.btn-primary{background:var(--atlas-green);color:#fff;box-shadow:0 8px 20px rgba(47,107,74,.18)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 11px 25px rgba(47,107,74,.23)}
.btn-secondary{background:rgba(255,255,255,.55);color:var(--atlas-ink);border:1px solid var(--atlas-line)}
.btn-secondary:hover{border-color:rgba(47,107,74,.35);color:var(--atlas-green)}
.home-link{display:inline-flex;align-items:center;gap:7px;margin-top:24px;color:var(--atlas-muted);font-size:13px;text-decoration:none}
.home-link:hover{color:var(--atlas-green)}
.home-link svg{width:16px;height:16px}
@media(max-width:520px){.page{padding:24px 16px}.logo{width:86px;height:86px;margin-bottom:20px}.code{letter-spacing:-2px}.actions{flex-direction:column}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="page">
  <section class="card" aria-labelledby="title">
    <img class="logo" src="assets/images/logo.png" alt="لوگوی اطلس شهدا">
    <div class="code" aria-hidden="true">۴۰۴</div>
    <h1 id="title">این صفحه در اطلس شهدا پیدا نشد</h1>
    <p>ممکن است نشانی صفحه تغییر کرده باشد یا این بخش هنوز در اطلس ایجاد نشده باشد.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">بازگشت به صفحه نخست</a>
      <a class="btn btn-secondary" href="pages/plan.html">مشاهده طرح اطلس</a>
    </div>
    <a class="home-link" href="index.html" aria-label="بازگشت به اطلس شهدا">
      اطلس شهدا
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </section>
</main>
</body>
</html>
